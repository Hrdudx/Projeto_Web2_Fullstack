spring.application.name=artifact-Web-2-fullstack

spring.datasource.url=jdbc:h2:file:./database.db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Aula 03 (opcional): console do H2 em http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Devolve a mensagem de erro dos Services (ex.: e-mail duplicado) para o front-end.
spring.web.error.include-message=always
